name: Capture Project Screenshots

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/capture-project-previews.mjs
      - .github/workflows/capture-project-previews.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-project-previews
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 sharp@0.34.5
          npx playwright install --with-deps chromium
      - name: Capture real production screens
        run: node .github/scripts/capture-project-previews.mjs
      - name: Commit project screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kotomachi.webp assets/fabflow.webp
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture live KotoMachi and FAB FLOW previews"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
