name: GitHub Profile 3D Contributions

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-3d.yml
  schedule:
    # Daily at 03:00 KST (18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit generated contribution images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update 3D contribution graph"
            # A re-run may be based on an older commit. Rebase before pushing.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
